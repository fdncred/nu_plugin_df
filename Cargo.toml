[package]
name = "nu_plugin_df"
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"
description = "Nushell plugin for Apache DataFusion dataframes and SQL"
readme = "README.md"
repository = "https://github.com/fdncred/nu_plugin_df"
license = "MIT"
keywords = ["dataframe", "datafusion", "nushell", "plugin", "sql"]
categories = ["command-line-utilities"]

[lib]
name = "nu_plugin_df"
path = "src/lib.rs"

[[bin]]
name = "nu_plugin_df"
path = "src/main.rs"

[dependencies]
nu-plugin = "0.117.0"
nu-protocol = "0.117.0"

chrono = { version = "0.4", default-features = false, features = ["std"] }
datafusion = {
  version = "55.3.0",
  default-features = true,
  features = [
    "nested_expressions",
    "parquet",
  ]
}
env_logger = "0.11"
futures = "0.3"
indexmap = "2"
log = "0.4"
rand = "0.10"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
typetag = "0.2"
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
tempfile = "3"

[profile.dev]
# DataFusion's debug binary exceeds macOS ld's 16MB compact-unwind
# (__eh_frame) limit. Unpacked dwarf plus optimized deps keeps the
# linked image smaller so the warning does not fire.
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 3
debug = 1

[profile.release]
strip = true
lto = true
codegen-units = 1
