[package]
name = "nu_plugin_df"
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"
license = "MIT"
authors = ["The Nushell Project Developers"]
description = "Nushell plugin for Apache DataFusion dataframes and SQL"
repository = "https://github.com/fdncred/nu_plugin_df"
readme = "README.md"
keywords = ["nushell", "plugin", "datafusion", "dataframe", "sql"]
categories = ["command-line-utilities"]

[[bin]]
name = "nu_plugin_df"
path = "src/main.rs"

[lib]
name = "nu_plugin_df"
path = "src/lib.rs"

[dependencies]
nu-plugin = { path = "../nushell/crates/nu-plugin" }
nu-protocol = { path = "../nushell/crates/nu-protocol", features = ["plugin"] }

datafusion = { version = "55.0.0", default-features = true, features = [
    "parquet",
    "nested_expressions",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
uuid = { version = "1", features = ["v4", "serde"] }
serde = { version = "1", features = ["derive"] }
typetag = "0.2"
log = "0.4"
env_logger = "0.11"
chrono = { version = "0.4", default-features = false, features = ["std"] }
indexmap = "2"
rand = "0.9"
futures = "0.3"

[dev-dependencies]
tempfile = "3"

[profile.dev]
# DataFusion's debug binary exceeds macOS ld's 16MB compact-unwind
# (__eh_frame) limit. Unpacked dwarf plus optimized deps keeps the
# linked image smaller so the warning does not fire.
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 3
debug = 1

[profile.release]
lto = true
codegen-units = 1
strip = true
